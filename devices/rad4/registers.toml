# Flash window (BAR2 + 0x800000)

[registers.flash]
space = "bar2"
offset = 0x800000
access = "rw"
width = 8
count = 65536
stride = 1
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver (flash sector requests)"
doc = "Parallel flash, 64 KiB in 128-byte sectors. Software use: the driver switches the bus region descriptor to 0xf84003c0, uses byte accesses at the address with its two low bits inverted, programs a sector with the usual three-byte unlock sequence (0xaa, 0x55, 0xa0; addresses in the kernel driver page), writes 128 bytes and polls the last one. The part is not identified; an AT29C512-compatible page-write flash fits the geometry (inferred)."

