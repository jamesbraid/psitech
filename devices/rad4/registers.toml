unit = "rad4"
prefix = "RAD4"
title = "RAD4 graphics head registers"
doc = "Registers of the PsiTech RAD4 PCI graphics board (PCI 12d1:0104) as the vendor's IRIX 6.5 driver and X server use them: a PLX PCI 9060-compatible bus interface, board-local framebuffer, timing and control registers, and the RAMDAC's indexed registers. Grades here are the three the definition format allows. established covers what a public datasheet or the shipped binaries state outright, including what the driver does, and each doc says which. inferred covers inferences and approximations, with the limit stated in the doc."
from = "PLX PCI 9060 Data Sheet, version 1.2"
public_from = ["PLX PCI 9060 Data Sheet", "IBM RGB561 Architecture", "PsiTech RAD4 release 1.3k"]
name_source = "ours"

[spaces.bar0]
unit = "byte"

[spaces.rom]
unit = "byte"

[spaces.bar2]
unit = "byte"

[spaces.rgb561]
unit = "byte"

# BAR0: PLX bus interface runtime registers

[registers.rom_remap]
space = "bar0"
offset = 0x14
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Expansion ROM remap register. Software use: the driver writes it once at attach, with the top byte 0xe1. Nothing reads it back."

[registers.bus_region_descriptor]
space = "bar0"
offset = 0x18
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Local bus region descriptor. Software use: the driver writes 0xf84303c3 at attach, which selects a 32-bit local bus."

[registers.mailbox]
space = "bar0"
offset = 0x40
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Mailbox 0. Software use: the driver reads it at attach and skips its own mode and RAMDAC setup when it is nonzero, because it takes that to mean a firmware initialiser has run, and writes zero to it at the end of every attach. What a real card holds here after power-on is unknown."

[registers.intcsr]
space = "bar0"
offset = 0x68
access = "rw"
width = 32
reset = 0x00010100
reset_grade = "established"
reset_from = "PLX PCI 9060 Data Sheet, version 1.2, Table 45 (bits 8 and 16 reset set)"
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Interrupt control and status, with the bits the driver uses. The driver ORs 0x50900 into it at attach whether or not pixel DMA is enabled."

[registers.intcsr.fields]
pci_int_enable = { bits = [8, 8], grade = "established" }
pci_local_int_enable = { bits = [11, 11], grade = "established" }
local_int_input_active = { bits = [15, 15], grade = "established" }
local_int_output_enable = { bits = [16, 16], grade = "established" }
dma0_int_enable = { bits = [18, 18], grade = "established" }
dma0_int_active = { bits = [21, 21], grade = "established" }

[registers.eeprom_ctl]
space = "bar0"
offset = 0x6c
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Serial EEPROM control. Bits 24 to 27 drive the configuration EEPROM. Bits 3 to 0 are the PCI read command the DMA engines use (public datasheet): the driver replaces them at attach with its DMA read command setting, 0xc by default, and the only values it accepts are 0x6, 0xc and 0xe; request 126 changes them later."

[registers.eeprom_ctl.fields]
clock = { bits = [24, 24], grade = "established" }
chip_select = { bits = [25, 25], grade = "established" }
data_to_eeprom = { bits = [26, 26], grade = "established" }
data_from_eeprom = { bits = [27, 27], grade = "established" }
dma_read_command = { bits = [3, 0], grade = "established" }

# Expansion ROM route: DMA channel 0 registers

[registers.dmamode0]
space = "rom"
offset = 0x100
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "DMA channel 0 mode. Software use: the driver reaches the DMA registers through the expansion ROM resource, writes 0x7c3 here (32-bit local bus, chaining, done interrupt enabled) and clears the done-interrupt bit when a transfer times out."

[registers.dmamode0.fields]
chaining = { bits = [9, 9], grade = "established" }
done_int_enable = { bits = [10, 10], grade = "established" }

[registers.dmadpr0]
space = "rom"
offset = 0x110
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "DMA channel 0 descriptor pointer. Loaded from each descriptor's next-pointer word. The driver starts it at the top of the board's 8 MiB local memory."

[registers.dmacsr0]
space = "rom"
offset = 0x128
access = "rw"
width = 32
reset = 0x00001010
reset_grade = "established"
reset_from = "PLX PCI 9060 Data Sheet, version 1.2, Table 57 (both channels' Done set)"
grade = "established"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "DMA command and status, channel 0 in bits 7 to 0. The driver starts a transfer by writing 3 (enable and start) and aborts one with 4 after a timeout, then polls Done."

[registers.dmacsr0.fields]
enable = { bits = [0, 0], grade = "established" }
start = { bits = [1, 1], grade = "established" }
abort = { bits = [2, 2], grade = "established" }
clear_int = { bits = [3, 3], grade = "established" }
done = { bits = [4, 4], grade = "established" }
user = { bits = [7, 5], grade = "established" }

# DMA descriptor next-pointer word (a word, not a register)

[words.DMA_DESC_NEXT]
width = 32
grade = "established"
from = "PLX PCI 9060 Data Sheet, version 1.2, Table 51"
name_source = "public"
name_cite = "PLX PCI 9060 Data Sheet, version 1.2"
doc = "Fourth word of a 16-byte chain descriptor (PCI address, local address, byte count, next pointer). It is loaded into the descriptor pointer register, and its low bits describe the descriptor's own transfer."

[words.DMA_DESC_NEXT.fields]
end_of_chain = { bits = [1, 1], grade = "established" }
int_on_complete = { bits = [2, 2], grade = "established" }
local_to_pci = { bits = [3, 3], grade = "established" }
next = { bits = [31, 4], grade = "established" }

