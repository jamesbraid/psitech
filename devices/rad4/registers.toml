[registers.timing_h0]
space = "bar2"
offset = 0xa00000
access = "rw"
width = 32
count = 1024
stride = 4
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver"
doc = "Horizontal timing bank 0. Software use: the mode loader writes one word per four-pixel group of the horizontal total (at most 781 words in the driver's modes). The words are computed from the mode record by the loader, read in full, and bank 1 and the vertical bank are written the same way; the field names below are the loader's structure read against VESA-style timings (modes.md, timing words), not a hardware statement. The bank depth is not known: 1024 words is the room before the next bank."

[registers.timing_h0.fields]
line_end_a = { bits = [0, 0], grade = "inferred" }
fetch_enable = { bits = [1, 1], grade = "inferred" }
line_end_b = { bits = [2, 2], grade = "inferred" }
display_enable = { bits = [3, 3], grade = "inferred" }
sync_window = { bits = [6, 6], grade = "inferred" }
sync_level = { bits = [7, 7], grade = "inferred" }

[registers.timing_h1]
space = "bar2"
offset = 0xa01000
access = "rw"
width = 32
count = 1024
stride = 4
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver"
doc = "Horizontal timing bank 1. Same use and limits as bank 0, but the loader sets only the line-end, sync-window and sync-level bits, never the two enable bits."

[registers.timing_h1.fields]
line_end_a = { bits = [0, 0], grade = "inferred" }
line_end_b = { bits = [2, 2], grade = "inferred" }
sync_window = { bits = [6, 6], grade = "inferred" }
sync_level = { bits = [7, 7], grade = "inferred" }

[registers.timing_h3]
space = "bar2"
offset = 0xa03000
access = "rw"
width = 32
count = 1024
stride = 4
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver"
doc = "Horizontal timing bank 3. Same use and limits as bank 1, with the sync-window bit inverted relative to banks 0 and 1 and the sync-level bit equal to theirs for separate sync (sync type 0) and inverted for composite sync and sync on green. The loader also holds a pointer to the slot between banks 1 and 3 and never writes it."

[registers.timing_h3.fields]
line_end_a = { bits = [0, 0], grade = "inferred" }
line_end_b = { bits = [2, 2], grade = "inferred" }
sync_window = { bits = [6, 6], grade = "inferred" }
sync_level = { bits = [7, 7], grade = "inferred" }

[registers.timing_v]
space = "bar2"
offset = 0xb00000
access = "rw"
width = 32
count = 2048
stride = 4
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver"
doc = "Vertical timing bank. Software use: one word per line of the vertical total, at most 1656 for the driver's modes, computed by the loader from the record. The depth is not known; 1656 is the largest count any shipped mode needs. The field names are the loader's structure read against VESA-style timings (modes.md, timing words)."

[registers.timing_v.fields]
frame_end = { bits = [0, 0], grade = "inferred" }
sync_marker = { bits = [1, 1], grade = "inferred" }
blank = { bits = [6, 6], grade = "inferred" }
sync_level = { bits = [7, 7], grade = "inferred" }

[registers.plane_mask]
space = "bar2"
offset = 0xd00000
access = "rw"
width = 32
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver and standalone X server"
doc = "Pixel write mask. Software use: the driver programs 0xffffffff at attach and around its DMA descriptor stores; the X server programs 0x0fffffff at screen start, then 0x00ffffff for colour drawing and 0x0f000000 for the overlay nibble before stores, and paints the window-type nibble under 0xf0000000 through the rectangle-fill request. The driver's buffered path sets the mask to the request mask before a DMA upload and restores the previous one after the transfer has finished, which is how the mask is kept live for DMA data (inferred). That a store merges as old under the inverse mask or value under the mask is the generic plane-mask convention. Which mask bit reaches which board plane is unknown: the software only treats bits 23 to 0 as colour, 27 to 24 as overlay and 31 to 28 as window type."

[registers.board_control]
space = "bar2"
offset = 0xf00000
access = "rw"
width = 32
grade = "inferred"
from = "PsiTech RAD4 release 1.3k driver"
doc = "Board control and status. Software use: the driver clears bit 5 while it programs a mode and sets it afterwards, sets bit 1 to ask for an interrupt at the next frame and clears it around DMA transfers, and its interrupt handler tests bit 5. That bit 5 reports a frame event only while bit 1 is set is inferred. Bit 7 is set whenever the keyboard and mouse controller has any interrupt enabled and cleared when none is. The status in bit 5 is read only by the interrupt handler, through a stored pointer, and bit 1 is cleared there when it is set. The physical effects are unknown."

[registers.board_control.fields]
frame_request = { bits = [1, 1], grade = "inferred" }
mode_gate_frame_status = { bits = [5, 5], grade = "inferred" }
km_interrupt_gate = { bits = [7, 7], grade = "inferred" }

