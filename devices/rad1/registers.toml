offset = 0x8
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "xf86-video-glint src/glint_regs.h (X.Org); Linux include/video/permedia2.h"
doc = "Interrupt enable. Software use: the kernel driver writes 0x83 once at attach, enabling the GP-DMA, sync and bypass-DMA interrupts (bits 0, 1 and 7), and its interrupt handler writes 0 on entry and restores 0x83 on exit. The textport library writes 0."

[registers.int_enable.fields]
dma = { bits = [0, 0], grade = "established" }
sync = { bits = [1, 1], grade = "established" }
bypass_dma = { bits = [7, 7], grade = "established" }

[registers.int_flags]
space = "rz"
offset = 0x10
access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "xf86-video-glint src/glint_regs.h (X.Org); Linux include/video/permedia2.h"
doc = "Interrupt status, cleared by writing the bits back. Software use: the handler reads it, writes the value back, and wakes one waiter for each of bits 1 (sync), 0 (GP output DMA) and 7 (bypass DMA). No other bit is tested."

[registers.int_flags.fields]
dma = { bits = [0, 0], grade = "established" }
sync = { bits = [1, 1], grade = "established" }
bypass_dma = { bits = [7, 7], grade = "established" }

