unit = "rad1"
prefix = "RAD1"
title = "RAD1 graphics head registers"
doc = "Registers of the PsiTech RAD1 PCI graphics board as the stock IRIX 6.5 kernel driver and the IO6 PROM textport use them. The board's chip is a TI TVP4020 (Permedia 2) or a 3Dlabs Permedia 2V, so every register here is a chip register: Region Zero (the 128 KiB register region) and the RAMDAC registers the chip holds behind its index ports. Names come from public X.Org and Linux drivers for those chips; the offsets are confirmed against the shipped objects. Grades here are the three the definition format allows: established covers what a public source or the shipped binaries state outright (the doc says which), inferred covers inferences and approximations, with the limit stated in the doc."
from = "xf86-video-glint, src/glint_regs.h; Linux include/video/permedia2.h; stock IRIX 6.5.30 kernel driver and IO6 PROM 6.156"
public_from = ["xf86-video-glint src/glint_regs.h", "Linux include/video/permedia2.h", "TI TVP4020 (Permedia 2) Programmer's Reference Manual"]
name_source = "public"
name_cite = "xf86-video-glint src/glint_regs.h (X.Org); Linux include/video/permedia2.h"

[spaces.rz]
unit = "byte"

[spaces.rz_p2]
unit = "byte"

