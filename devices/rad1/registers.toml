access = "rw"
width = 32
grade = "established"
name_source = "public"
name_cite = "xf86-video-glint src/glint_regs.h (X.Org); Linux include/video/permedia2.h"
doc = "Soft reset. Software use: board start-up writes 0 and polls bit 31 until it clears, before programming anything else."

[registers.int_enable]
